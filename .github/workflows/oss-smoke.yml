name: oss-smoke
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/*.md'

concurrency:
  group: pcie-dma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verilator-uvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BUILD_OUT: ${{ github.workspace }}/out/verilator/ci-build
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned DUT/UVM
        run: bash scripts/bootstrap_oss.sh
      - name: Static checks
        run: python3 scripts/check_project.py
      - name: Compile + H2C/C2H smoke
        run: |
          source .env.oss
          FORCE_REBUILD=1 TEST=dma_smoke_test SEED=1 bash scripts/run_verilator.sh
      - name: 4KiB split
        run: |
          source .env.oss
          TEST=dma_4k_split_test SEED=2 bash scripts/run_verilator.sh
      - name: 16 simultaneous PCIe tags
        run: |
          source .env.oss
          TEST=dma_16tag_test SEED=3 bash scripts/run_verilator.sh
      - name: Small and unaligned transfers
        run: |
          source .env.oss
          TEST=dma_small_unaligned_test SEED=4 bash scripts/run_verilator.sh
      - name: MRRS 512B and MPS 256B
        run: |
          source .env.oss
          TEST=dma_limits_test SEED=5 bash scripts/run_verilator.sh
      - name: Split completion + cross-tag OOO
        run: |
          source .env.oss
          TEST=dma_split_ooo_test SEED=6 bash scripts/run_verilator.sh
      - name: PCIe + RAM backpressure
        run: |
          source .env.oss
          TEST=dma_backpressure_test SEED=7 bash scripts/run_verilator.sh

      - name: Completion error propagation
        run: |
          source .env.oss
          TEST=dma_completion_error_test SEED=9 bash scripts/run_verilator.sh
      - name: 65535-byte descriptor boundary
        run: |
          source .env.oss
          TEST=dma_max_len_test SEED=8 bash scripts/run_verilator.sh
      - name: Zero-length DMA semantics
        run: |
          source .env.oss
          TEST=dma_zero_len_test SEED=12 bash scripts/run_verilator.sh
      - name: Mid-flight reset recovery
        run: |
          source .env.oss
          TEST=dma_reset_recovery_test SEED=13 bash scripts/run_verilator.sh
      - name: Read/write enable gating
        run: |
          source .env.oss
          TEST=dma_enable_gating_test SEED=14 bash scripts/run_verilator.sh
      - name: 1MiB chained H2C
        run: |
          source .env.oss
          TEST=dma_1m_chain_test SEED=10 bash scripts/run_verilator.sh
      - name: Mixed random stress seed 11
        run: |
          source .env.oss
          TEST=dma_random_stress_test SEED=11 bash scripts/run_verilator.sh
      - name: Mixed random stress seed 29
        run: |
          source .env.oss
          TEST=dma_random_stress_test SEED=29 bash scripts/run_verilator.sh
      - name: Mixed random stress seed 47
        run: |
          source .env.oss
          TEST=dma_random_stress_test SEED=47 bash scripts/run_verilator.sh
      - name: Qualify regression evidence
        run: |
          python3 scripts/summarize_regression.py
      - name: Merge coverage and report DUT scope
        run: |
          bash scripts/merge_coverage.sh
      - name: Reproduce discovered upstream max-length read bug
        run: |
          source .env.oss
          bash scripts/repro_upstream_maxlen_bug.sh
      - name: Archive regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcie-dma-regression-${{ github.run_number }}
          path: |
            out/verilator/runs/**/run.log
            out/verilator/runs/**/coverage.dat
            out/verilator/qualification/**
            out/verilator/coverage/**
            out/verilator/repro_upstream_maxlen_bug/run.log
            out/verilator/repro-upstream-build/compile.log
            out/verilator/ci-build/compile.log
          if-no-files-found: warn
